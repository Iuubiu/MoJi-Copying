[package]
name = "moji"
version = "0.1.0"
description = "墨迹 · 小说抄写工作台"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：把 SQLite 源码一起编进来，目标机器不需要装任何数据库运行时。
# 代价是首次编译要多花一两分钟（只此一次）。
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
